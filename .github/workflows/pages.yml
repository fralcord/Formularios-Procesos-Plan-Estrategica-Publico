name: Deploy public forms preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out public preview
        uses: actions/checkout@v4
      - name: Prepare website files
        run: |
          mkdir _site
          cp index.html pertinencia.html circular-33.html evaluacion-5000-utm.html evaluacion-programas.html _site/
          cp -r css js _site/
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
